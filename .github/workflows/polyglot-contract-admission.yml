name: Polyglot contract admission

on:
  workflow_call:
    inputs:
      minimum_pairs:
        description: Minimum number of ores-cli contracts.config.json peer pairs required
        required: false
        type: number
        default: 1
      language_manifest:
        description: Optional TJSV language-boundaries/v1 manifest that requires exact CI-produced evidence for every declared runtime
        required: false
        type: string
        default: ''
      minimum_languages:
        description: Minimum distinct required languages; must be >=2 for strict evidence admission
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  peer-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact caller head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: a9db1298cd4c993744a7b24bbc8f0ae9d1d0a33a
          path: .ores-tools/tjsv
          persist-credentials: false
      - name: Install immutable TJSV toolchain
        run: npm ci --prefix .ores-tools/tjsv
      - name: Discover and validate peer manifests
        env:
          MINIMUM_PAIRS: ${{ inputs.minimum_pairs }}
          LANGUAGE_MANIFEST: ${{ inputs.language_manifest }}
          MINIMUM_LANGUAGES: ${{ inputs.minimum_languages }}
        run: |
          mkdir -p tmp/tjsv-reports
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import { dirname, join, normalize, relative, resolve, sep } from 'node:path';

          const root = process.cwd();
          const excluded = new Set(['.git','.typespec-json-schema-validator','artifacts','build','dist','evidence','generated','node_modules','out','target','tmp']);
          const configs = [];
          const walk = (dir, depth = 0) => {
            if (depth > 16) throw new Error(`contract walk exceeded depth at ${dir}`);
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              if (entry.isSymbolicLink()) throw new Error(`symlink is not admissible in contract tree: ${join(dir, entry.name)}`);
              if (entry.isDirectory()) {
                if (!excluded.has(entry.name)) walk(join(dir, entry.name), depth + 1);
              } else if (entry.isFile() && entry.name === 'contracts.config.json') {
                configs.push(join(dir, entry.name));
              }
            }
          };
          try { walk(join(root, 'contracts')); } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
          }
          configs.sort();
          const minimum = Number(process.env.MINIMUM_PAIRS || '1');
          if (!Number.isSafeInteger(minimum) || minimum < 0) throw new Error('minimum_pairs must be a non-negative integer');
          if (configs.length < minimum) throw new Error(`expected at least ${minimum} contracts.config.json peer pair(s), found ${configs.length}`);

          const rows = [];
          for (const config of configs) {
            const doc = JSON.parse(readFileSync(config, 'utf8'));
            if (typeof doc.typespec !== 'string' || !doc.typespec.trim()) throw new Error(`${config}: missing typespec`);
            if (typeof doc.jsonSchema !== 'string' || !doc.jsonSchema.trim()) throw new Error(`${config}: missing jsonSchema`);
            const home = dirname(config);
            const resolvePeer = (value, label, extension) => {
              if (typeof value !== 'string' || !value.trim()) throw new Error(`${config}: invalid ${label} path`);
              const normalized = normalize(value);
              if (normalized.startsWith('..' + sep) || normalized === '..' || resolve(home, normalized) === root) throw new Error(`${config}: unsafe ${label} path`);
              if (normalized.split(/[\\/]+/).some(part => excluded.has(part))) throw new Error(`${config}: ${label} is under generated/evidence/build output`);
              const full = resolve(home, normalized);
              if (!full.startsWith(root + sep)) throw new Error(`${config}: ${label} escapes repository`);
              if (!statSync(full).isFile()) throw new Error(`${config}: ${label} is not a regular file`);
              const rel = relative(root, full);
              if (extension && !rel.endsWith(extension)) throw new Error(`${config}: ${label} must be ${extension}`);
              return rel;
            };
            const tsp = resolvePeer(doc.typespec, 'TypeSpec authority', '.tsp');
            const schema = resolvePeer(doc.jsonSchema, 'JSON Schema authority', '.json');
            if (tsp === schema) throw new Error(`${config}: peer authorities must be distinct files`);
            const schemaDoc = JSON.parse(readFileSync(join(root, schema), 'utf8'));
            if (schemaDoc.$schema !== 'https://json-schema.org/draft/2020-12/schema') throw new Error(`${schema}: must declare Draft 2020-12`);

            const mapping = doc.mapping === undefined ? '-' : resolvePeer(doc.mapping, 'TJSV mapping', '.json');
            const tjsv = doc.tjsv ?? {};
            if (tjsv === null || Array.isArray(tjsv) || typeof tjsv !== 'object') throw new Error(`${config}: tjsv must be an object`);
            const unknownTjsv = Object.keys(tjsv).filter(key => !['int64Strategy', 'sealObjectSchemas'].includes(key));
            if (unknownTjsv.length) throw new Error(`${config}: unknown tjsv option(s): ${unknownTjsv.sort().join(', ')}`);
            const int64Strategy = tjsv.int64Strategy ?? 'string';
            if (!['string', 'number'].includes(int64Strategy)) throw new Error(`${config}: tjsv.int64Strategy must be string or number`);
            const sealObjectSchemas = tjsv.sealObjectSchemas ?? true;
            if (typeof sealObjectSchemas !== 'boolean') throw new Error(`${config}: tjsv.sealObjectSchemas must be boolean`);

            const instances = join(home, 'instances');
            const instancesRel = statSafeDirectory(instances) ? relative(root, instances) : '-';
            rows.push([relative(root, config), tsp, schema, instancesRel, mapping, int64Strategy, String(sealObjectSchemas)].join('\t'));
          }

          function statSafeDirectory(path) {
            try { return statSync(path).isDirectory(); } catch { return false; }
          }

          const manifest = process.env.LANGUAGE_MANIFEST?.trim();
          if (manifest) {
            const full = resolve(root, normalize(manifest));
            if (!full.startsWith(root + sep)) throw new Error('language_manifest escapes repository');
            const doc = JSON.parse(readFileSync(full, 'utf8'));
            if (configs.length !== 1) throw new Error('strict runtime evidence requires exactly one peer pair per invocation; split multi-pair verification into separate jobs');
            if (doc?.schema !== 'ores.typespec-json-schema-validator.language-boundaries/v1') throw new Error('language_manifest must be a TJSV language-boundaries/v1 document, not a list of names');
            const min = Number(process.env.MINIMUM_LANGUAGES || '0');
            if (!Number.isSafeInteger(min) || min < 0) throw new Error('minimum_languages must be a non-negative integer');
            const targets = doc.targets;
            if (!Array.isArray(targets) || targets.length === 0) throw new Error('strict language boundaries require concrete runtime targets');
            if (targets.some(target => target?.required !== true || target?.ingress !== true || target?.egress !== true)) throw new Error('every declared runtime must be required and validate ingress plus egress');
            const names = [...new Set(targets.map(target => target.language))];
            if (names.length < Math.max(2, min)) throw new Error(`runtime boundary has ${names.length} languages; at least ${Math.max(2, min)} required`);
            console.log(`strict language boundaries: ${targets.length} required runtimes, ${names.length} languages`);
          }

          writeFileSync('tmp/tjsv-pairs.tsv', rows.join('\n') + (rows.length ? '\n' : ''));
          console.log(`ores-cli-compatible peer manifests: ${rows.length}`);
          NODE
      - name: Run TJSV over every declared peer authority
        run: |
          set -euo pipefail
          i=0
          while IFS=$'\t' read -r config typespec schema instances mapping int64_strategy seal_object_schemas; do
            [ -n "$config" ] || continue
            i=$((i + 1))
            args=(check "--typespec=$typespec" "--schema=$schema" "--report=tmp/tjsv-reports/$i.json" "--contract-ir=tmp/tjsv-reports/$i.ir.json" "--output-dir=tmp/tjsv-generated/$i" "--int64-strategy=$int64_strategy" "--seal-object-schemas=$seal_object_schemas")
            if [ "$instances" != '-' ]; then args+=("--instances=$instances"); fi
            if [ "$mapping" != '-' ]; then args+=("--mapping=$mapping"); fi
            node .ores-tools/tjsv/bin/typespec-json-schema-validator.mjs "${args[@]}"
          done < tmp/tjsv-pairs.tsv
      # The calling workflow must build/test every language and upload these
      # exact-head JSON receipts. A list of names is never implementation proof.
      - name: Download native runtime proof receipts
        if: ${{ inputs.language_manifest != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polyglot-runtime-evidence
          path: tmp/runtime-evidence
      - name: Admit polyglot runtime evidence against fresh TypeSpec and JSON Schema
        if: ${{ inputs.language_manifest != '' }}
        env:
          LANGUAGE_MANIFEST: ${{ inputs.language_manifest }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, lstatSync } from 'node:fs';
          import { resolve, relative, sep } from 'node:path';
          import { verifyLanguageBoundariesAgainstCurrentInputs } from './.ores-tools/tjsv/src/language-boundary-current-inputs.mjs';

          const root = process.cwd();
          function admittedFile(value, label, base = root) {
            if (typeof value !== 'string' || !value || value.includes('\\') || value.startsWith('/') || value.split('/').some(p => p === '' || p === '.' || p === '..')) {
              throw new Error(label + ' must be a canonical relative file');
            }
            const abs = resolve(base, value);
            const rel = relative(base, abs);
            if (!rel || rel === '..' || rel.startsWith('..' + sep)) throw new Error(label + ' escapes allowed root');
            let at = base;
            for (const part of value.split('/')) {
              at = resolve(at, part);
              if (lstatSync(at).isSymbolicLink()) throw new Error(label + ' crosses symlink');
            }
            if (!lstatSync(abs).isFile()) throw new Error(label + ' must be a regular file');
            return abs;
          }
          const manifest = JSON.parse(readFileSync(admittedFile(process.env.LANGUAGE_MANIFEST, 'manifest'), 'utf8'));
          if (manifest.schema !== 'ores.typespec-json-schema-validator.language-boundaries/v1') throw new Error('unsupported language boundary manifest');
          if (!Array.isArray(manifest.targets) || manifest.targets.length === 0) throw new Error('missing runtime targets');
          const evidenceRoot = resolve(root, 'tmp/runtime-evidence');
          const evidenceByPath = Object.create(null);
          for (const target of manifest.targets) {
            if (target?.required !== true || target?.ingress !== true || target?.egress !== true) throw new Error('all targets require bidirectional validation');
            const evidence = JSON.parse(readFileSync(admittedFile(target.evidence, 'runtime receipt', evidenceRoot), 'utf8'));
            if (evidence.sourceRevision !== process.env.EXPECTED_SHA) throw new Error('runtime receipt is not bound to the exact checkout revision');
            if (Object.hasOwn(evidenceByPath, target.evidence)) throw new Error('one receipt cannot stand for multiple runtimes');
            evidenceByPath[target.evidence] = evidence;
          }
          const rows = readFileSync('tmp/tjsv-pairs.tsv', 'utf8').trim().split('\n').filter(Boolean);
          if (rows.length !== 1) throw new Error('strict conformance requires one peer pair per invocation');
          const [, typespec, authoredSchema] = rows[0].split('\t');
          const report = JSON.parse(readFileSync('tmp/tjsv-reports/1.json', 'utf8'));
          const contractIr = JSON.parse(readFileSync('tmp/tjsv-reports/1.ir.json', 'utf8'));
          const receipt = await verifyLanguageBoundariesAgainstCurrentInputs({
            typespec: admittedFile(typespec, 'TypeSpec'),
            authoredSchema: admittedFile(authoredSchema, 'JSON Schema'),
            generatedSchema: admittedFile('tmp/tjsv-generated/1/typespec.generated.schema.json', 'comparison witness'),
            report, contractIr, manifest, evidenceByPath,
          });
          if (receipt.status !== 'passed' || receipt.zeroUnexplainedFindings !== true || receipt.counts.admittedEvidence !== manifest.targets.length) {
            throw new Error('polyglot admission refused: ' + receipt.findings.map(f => f.ruleId).join(', '));
          }
          console.log(JSON.stringify({ status: receipt.status, verificationId: receipt.verificationId, admittedEvidence: receipt.counts.admittedEvidence }));
          NODE
      - name: Retain TJSV parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: peer-authority-tjsv-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/tjsv-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Prove authored sources were not mutated
        run: |
          git diff --exit-code HEAD
          git status --porcelain --untracked-files=no | test ! -s /dev/stdin
