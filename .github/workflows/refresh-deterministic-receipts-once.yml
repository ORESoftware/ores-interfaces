name: refresh deterministic receipts once

on:
  push:
    branches: [fix/deterministic-public-receipts-pin-chain]
    paths:
      - '.github/workflows/refresh-deterministic-receipts-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/deterministic-public-receipts-pin-chain
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Advance coherent immutable source and validator pins
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const source = 'ff0d346270e0393fe8d1f95b2f2ec19e1ef97405';
          const validator = 'bfe9667cc6ac8863d436587d8125c4eb66ddd647';
          const oldSource = '18840cb8e4bdff51ea394a4d6221f7ab2cee1061';
          const oldValidator = '03aa2c1e44c6745c1abca9c1399a942cc315a8d8';

          const policyPath = 'shared-interfaces.json';
          const policy = JSON.parse(readFileSync(policyPath, 'utf8'));
          if (policy.source?.commit !== oldSource) throw new Error(`unexpected source pin ${policy.source?.commit}`);
          if (policy.validator?.commit !== oldValidator) throw new Error(`unexpected validator pin ${policy.validator?.commit}`);
          policy.source.commit = source;
          policy.validator.commit = validator;
          writeFileSync(policyPath, `${JSON.stringify(policy, null, 2)}\n`);

          for (const path of [
            '.github/workflows/env-manifest-tjsv.yml',
            '.github/workflows/rpc-operation-tjsv.yml',
            'contracts/rpc-operation/v1/README.md',
          ]) {
            const before = readFileSync(path, 'utf8');
            if (!before.includes(oldValidator)) throw new Error(`${path} did not contain expected old validator pin`);
            const after = before.split(oldValidator).join(validator);
            if (after.includes(oldValidator)) throw new Error(`${path} retained old validator pin`);
            writeFileSync(path, after);
          }
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-otel/ores-interfaces
          ref: ff0d346270e0393fe8d1f95b2f2ec19e1ef97405
          path: .deps/compat
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: bfe9667cc6ac8863d436587d8125c4eb66ddd647
          path: .deps/tjsv
          persist-credentials: false
      - name: Install exact validator toolchain
        run: npm ci --prefix .deps/tjsv --no-audit --no-fund
      - name: Generate twice and prove deterministic bytes
        run: |
          set -euo pipefail
          npm run build
          cp generated/public/provenance.json "$RUNNER_TEMP/provenance.pass1.json"
          cp generated/public/interface-release.json "$RUNNER_TEMP/interface-release.pass1.json"
          npm run build
          cmp "$RUNNER_TEMP/provenance.pass1.json" generated/public/provenance.json
          cmp "$RUNNER_TEMP/interface-release.pass1.json" generated/public/interface-release.json
      - name: Commit exact generated evidence
        run: |
          set -euo pipefail
          git config user.name ORESoftware
          git config user.email noreply@github.com
          git add shared-interfaces.json \
            .github/workflows/env-manifest-tjsv.yml \
            .github/workflows/rpc-operation-tjsv.yml \
            contracts/rpc-operation/v1/README.md \
            generated/public/provenance.json \
            generated/public/interface-release.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'no refresh needed'; exit 0; }
          git commit -m 'fix(receipts): advance deterministic validator epoch'
          git push origin HEAD:fix/deterministic-public-receipts-pin-chain
