name: Shared validation admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPSTREAM_ROOT: ${{ github.workspace }}/.deps/legacy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ores-otel/ores-interfaces
          ref: 5e1b9c583e1734b3aa78b585317e1a0de3374ae1
          path: .deps/legacy
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
      - run: node --test test/*.test.mjs
      - name: Validate Zed manifest and execute repository check task
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zed.tar.gz"
          curl --fail --location --silent --show-error https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-musl.tar.gz --output "$archive"
          printf '%s  %s\n' e380240c96242ab3b29e0e9d14c95ba946d086f20f0732e34d0e5cf47513efc7 "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zed-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/zed-bin"
          "$RUNNER_TEMP/zed-bin/zed" validate
          "$RUNNER_TEMP/zed-bin/zed" task run check

  peer-authorities:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
      - uses: ORESoftware/typespec-json-schema-validator@4473504c4c9d2831d825919f70c03994d8ce01d2
        with:
          typespec: contracts/shared-public/validation.tsp
          schema: contracts/shared-public/schema.json
          instances: corpus
          report: tmp/tjsv/report.json
          sarif: tmp/tjsv/report.sarif
          contract_ir: tmp/tjsv/contract-ir.json
          output_dir: tmp/tjsv/generated
      - name: Retain failed or passed evidence without treating it as approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-validation-${{ github.sha }}
          path: tmp/tjsv/
          if-no-files-found: error
          retention-days: 14
